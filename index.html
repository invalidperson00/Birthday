<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday My Love ❤️</title>

<meta name="theme-color" content="#ff4d88">

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

</head>

<body>

<!-- ========= BACKGROUND ========= -->

<div id="nightSky"></div>

<div id="starsContainer"></div>

<div id="sparkleContainer"></div>

<div id="floatingHearts"></div>

<div id="rosePetals"></div>

<div id="balloons"></div>

<div id="confetti"></div>

<div id="fireworks"></div>

<!-- ========= MUSIC ========= -->

<audio id="bgMusic" loop>
<source src="music/background.mp3" type="audio/mpeg">
</audio>

<!-- ========= WELCOME SCREEN ========= -->

<section id="welcomeScreen">

<div class="glassCard">

<h1 class="mainTitle">

Happy Birthday

<br>

<span>My Love ❤️</span>

</h1>

<p class="subtitle">

Every heartbeat of mine has a story...

Today, it is all about you.

</p>

<button id="startButton">

<div class="pulseHeart">

❤️

</div>

<span>Tap Here</span>

</button>

</div>

</section>

<!-- ========= STORY SECTION ========= -->

<section id="storySection" class="hidden">

<!-- Envelope 1 -->

<div class="envelopeScene active" id="scene1">

<div class="envelope">

<div class="envelopeBack"></div>

<div class="letterPaper"></div>

<div class="envelopeFront"></div>

<div class="heartSeal" data-letter="1">

❤️

</div>

</div>

</div>

<!-- Letter 1 -->

<div class="letter hidden" id="letter1">

<h2>Happy Birthday My Girl ❤️</h2>

<p id="message1"></p>

<button class="nextButton" data-next="2">

Next Surprise ❤️

</button>

</div>
<!-- ================= ENVELOPE 2 ================= -->

<div class="envelopeScene hidden" id="scene2">

    <div class="envelope">

        <div class="envelopeBack"></div>

        <div class="letterPaper"></div>

        <div class="envelopeFront"></div>

        <div class="heartSeal" data-letter="2">
            ❤️
        </div>

    </div>

</div>

<!-- ================= LETTER 2 ================= -->

<div class="letter hidden" id="letter2">

    <h2>My Beautiful Love 💌</h2>

    <p id="message2"></p>

    <button class="nextButton" data-next="3">

        One More Letter ❤️

    </button>

</div>

<!-- ================= ENVELOPE 3 ================= -->

<div class="envelopeScene hidden" id="scene3">

    <div class="envelope">

        <div class="envelopeBack"></div>

        <div class="letterPaper"></div>

        <div class="envelopeFront"></div>

        <div class="heartSeal" data-letter="3">
            ❤️
        </div>

    </div>

</div>

<!-- ================= LETTER 3 ================= -->

<div class="letter hidden" id="letter3">

    <h2>Our Forever Promise ❤️</h2>

    <p id="message3"></p>

    <button class="nextButton" data-next="4">

        Final Surprise 🎁

    </button>

</div>

<!-- ================= ENVELOPE 4 ================= -->

<div class="envelopeScene hidden" id="scene4">

    <div class="envelope finalEnvelope">

        <div class="envelopeBack"></div>

        <div class="letterPaper"></div>

        <div class="envelopeFront"></div>

        <div class="heartSeal finalSeal">
            ❤️
        </div>

    </div>

</div>

<!-- ================= FINAL LETTER ================= -->

<div class="letter hidden finalLetter" id="letter4">

    <h1>🎉 Happist Birthday My Love ❤️ 🎉</h1>

    <p id="message4"></p>

</div>

</section>

<!-- ================= PARTICLE EFFECTS ================= -->

<div class="magicParticles">

    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>
    <span class="particle p6"></span>
    <span class="particle p7"></span>
    <span class="particle p8"></span>
    <span class="particle p9"></span>
    <span class="particle p10"></span>

</div>

<!-- ================= FOOTER ================= -->

<footer>

    <p>
        Made with ❤️ Forever & Always
    </p>

</footer>

<script src="script.js"></script>

</body>
</html>
